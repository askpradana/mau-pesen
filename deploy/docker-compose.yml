version: "3.8"
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mau_pesen
      POSTGRES_PORT: 5432
      SSL_MODE: disable
    ports:
      - "5432:5432"
    volumes:
      -  databasee-data:/var/lib/postgresql/data
      - ./internal/databasee/migrations:/docker-entrypoint-initdb.d/001_init.sql
  app:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8080:8080"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  db-data: